# 空射武器档案 7 档（air_data.py:57-128 迁 YAML——GP-01 §1.1/DATA-03 §3）。
# 数值＝air_data 冻结现值逐字平移（source 分级注释随迁：溅射/压制锚 GDD-03 §2.3
